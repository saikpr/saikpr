<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none">
  <title>amazon nova · now. Measure, improve, and ship the model. Evaluation harness for 50+ agentic benchmarks, verifier-backed RL data, and model delivery at Bedrock scale.</title>
  <defs>
    <pattern id="nv-p" width="22" height="22" patternUnits="userSpaceOnUse" x="11.0" y="11.0">
      <circle cx="11.0" cy="11.0" r="1.5" fill="#ededed"/>
    </pattern>
    <pattern id="nv-pa" width="22" height="22" patternUnits="userSpaceOnUse" x="11.0" y="11.0">
      <circle cx="11.0" cy="11.0" r="1.8" fill="#34d399"/>
    </pattern>
    <radialGradient id="nv-fade" cx="770" cy="180" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 180) scale(480 320) translate(-770 -180)">
      <stop stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nv-hot" cx="770" cy="180" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 180) scale(300 200) translate(-770 -180)">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nv-glow" cx="770" cy="180" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 180) scale(330 220) translate(-770 -180)">
      <stop stop-color="#34d399" stop-opacity=".14"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <mask id="nv-mf"><rect width="1000" height="360" fill="url(#nv-fade)"/></mask>
    <mask id="nv-mh"><rect width="1000" height="360" fill="url(#nv-hot)"/></mask>
    <clipPath id="nv-bounds"><rect width="1000" height="360" rx="12"/></clipPath>
  </defs>
